server {
    listen 80;
    root /usr/share/nginx/html;

    # Search words in a URL can hold customer data, and tickets must stay out of logs.
    access_log off;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        client_max_body_size 11m;
        # Keeps uploads off this container's disk too: raw tickets never reach one (ADR-0003).
        proxy_request_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
